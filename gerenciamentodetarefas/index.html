<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-4">
    <h2 class="mb-4">Tarefas</h2>

    <div class="mb-3">
      <div class="d-flex gap-2 mb-2">
        <input type="text" id="input-tarefa" class="form-control" placeholder="Digite uma tarefa..."/>
        <button id="btn-adicionar" class="btn btn-primary">OK</button>
      </div>
    </div>

    <div id="lista-tarefas" class="row g-3"></div>
  </div>

  <script>
    const inputTarefa  = document.getElementById("input-tarefa");
    const btnAdicionar = document.getElementById("btn-adicionar");
    const listaTarefas = document.getElementById("lista-tarefas");

    btnAdicionar.addEventListener("click", function() {
      const nomeTarefa = inputTarefa.value;

      if (nomeTarefa === "") {
        alert("Digite o nome da tarefa!");
        return;
      }

      const col = document.createElement("div");
      col.classList.add("col-md-4");

      const card = document.createElement("div");
      card.classList.add("card", "p-3", "bg-warning"); 

      const titulo = document.createElement("h5");
      titulo.innerText = nomeTarefa;

      const prioridade = document.createElement("p");
      prioridade.innerText = "Prioridade: Média";

      const btnAlta = document.createElement("button");
      btnAlta.innerText = "Alta";
      btnAlta.classList.add("btn", "btn-danger", "btn-sm", "me-1");

      const btnMedia = document.createElement("button");
      btnMedia.innerText = "Média";
      btnMedia.classList.add("btn", "btn-warning", "btn-sm", "me-1");

      const btnBaixa = document.createElement("button");
      btnBaixa.innerText = "Baixa";
      btnBaixa.classList.add("btn", "btn-success", "btn-sm");

      btnAlta.addEventListener("click", function() {
        card.className = "card p-3 bg-danger text-white";
        prioridade.innerText = "Prioridade: Alta";
      });

      btnMedia.addEventListener("click", function() {
        card.className = "card p-3 bg-warning";
        prioridade.innerText = "Prioridade: Média";
      });

      btnBaixa.addEventListener("click", function() {
        card.className = "card p-3 bg-success text-white";
        prioridade.innerText = "Prioridade: Baixa";
      });

      card.appendChild(titulo);
      card.appendChild(prioridade);
      card.appendChild(btnAlta);
      card.appendChild(btnMedia);
      card.appendChild(btnBaixa);

      col.appendChild(card);
      listaTarefas.appendChild(col);

      inputTarefa.value = "";
    });

    inputTarefa.addEventListener("keydown", function(e) {
      if (e.key === "Enter") btnAdicionar.click();
    });
  </script>

</body>
</html>
